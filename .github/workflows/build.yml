name: Build Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Manual trigger

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk
      CMDLINE_TOOLS_VERSION: 11076708_latest
      ANDROID_API_LEVEL: 34
      ANDROID_BUILD_TOOLS_VERSION: 34.0.0
      GRADLE_VERSION: 8.7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle (official action - handles wrapper, cache, everything)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: wrapper
          cache-read-only: false

      - name: Install Android SDK (manual, reliable)
        run: |
          set -euo pipefail
          
          # Create SDK directory
          sudo mkdir -p "$ANDROID_SDK_ROOT"
          sudo chown -R runner:runner "$ANDROID_SDK_ROOT"
          
          # Download command line tools
          cd "$ANDROID_SDK_ROOT"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-temp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
          rm -rf cmdline-tools-temp cmdline-tools.zip
          
          # Add to PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          
          # Accept licenses NON-INTERACTIVELY (create license files directly)
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_SDK_ROOT/licenses/android-googletv-license"
          echo "859f4b5f1b8c3b9e4c5d6e7f8a9b0c1d2e3f4a5b" > "$ANDROID_SDK_ROOT/licenses/android-tv-license"
          echo "a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1" > "$ANDROID_SDK_ROOT/licenses/android-wear-license"
          
          # Install required packages (licenses already accepted)
          cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "extras;android;m2repository" \
            "extras;google;m2repository" \
            "extras;google;google_play_services"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GOOGLE_SERVICES_JSON: ""

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 0

      - name: Upload APK info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "APK Size: $SIZE"
          fi

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Build result
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build successful! APK available as artifact."
          else
            echo "❌ Build failed. Check the logs."
            exit 1
          fi